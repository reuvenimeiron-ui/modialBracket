<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 94" shape-rendering="crispEdges">
  <!-- Classic red biplane — faces RIGHT, tail on right -->

  <!-- UPPER WING -->
  <rect x="16" y="4"  width="68" height="8"  fill="#D53030"/>
  <!-- Wing tips yellow -->
  <rect x="12" y="4"  width="6"  height="8"  fill="#F5C142"/>
  <rect x="84" y="4"  width="8"  height="8"  fill="#F5C142"/>

  <!-- Biplane struts (vertical) -->
  <rect x="30" y="12" width="4" height="18" fill="#AA1818"/>
  <rect x="68" y="12" width="4" height="18" fill="#AA1818"/>
  <!-- Cross strut (diagonal bar) -->
  <rect x="30" y="19" width="42" height="3" fill="#AA1818"/>

  <!-- FUSELAGE -->
  <rect x="8"  y="20" width="86" height="22" fill="#D53030"/>
  <rect x="4"  y="24" width="8"  height="14" fill="#D53030"/>
  <!-- Engine cowl -->
  <rect x="2"  y="22" width="8"  height="18" fill="#AA1818"/>

  <!-- Cockpit window -->
  <rect x="32" y="22" width="24" height="12" fill="#87CEEB"/>
  <rect x="34" y="24" width="20" height="8"  fill="#C0E8FF"/>
  <rect x="32" y="22" width="24" height="3"  fill="#AA1818"/>

  <!-- Tail vertical fin -->
  <rect x="88" y="10" width="12" height="24" fill="#D53030"/>
  <rect x="94" y="6"  width="8"  height="16" fill="#AA1818"/>

  <!-- LOWER WING -->
  <rect x="16" y="42" width="68" height="8"  fill="#D53030"/>
  <rect x="12" y="42" width="6"  height="8"  fill="#F5C142"/>
  <rect x="84" y="42" width="8"  height="8"  fill="#F5C142"/>

  <!-- Tail horizontal fin -->
  <rect x="88" y="52" width="24" height="8"  fill="#F5C142"/>

  <!-- WHEEL STRUTS -->
  <rect x="32" y="50" width="4" height="20" fill="#AA1818"/>
  <rect x="66" y="50" width="4" height="20" fill="#AA1818"/>
  <!-- Axle bar -->
  <rect x="32" y="66" width="38" height="4" fill="#AA1818"/>

  <!-- WHEELS -->
  <rect x="24" y="68" width="18" height="12" fill="#1A1A1A"/>
  <rect x="62" y="68" width="18" height="12" fill="#1A1A1A"/>
  <rect x="26" y="66" width="14" height="6"  fill="#333"/>
  <rect x="64" y="66" width="14" height="6"  fill="#333"/>

  <!-- Propeller hub -->
  <rect x="0"  y="26" width="6"  height="10" fill="#555"/>
  <!-- Propeller blades (yellow) -->
  <rect x="1"  y="10" width="4"  height="18" fill="#F5C142"/>
  <rect x="1"  y="28" width="4"  height="18" fill="#F5C142"/>
</svg>
