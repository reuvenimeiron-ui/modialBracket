<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 66" shape-rendering="crispEdges">
  <!-- Green streamlined modern plane — faces RIGHT, tail on right -->

  <!-- NOSE CONE (pointed) -->
  <rect x="2"  y="30" width="6"  height="6"  fill="#3DAF52"/>
  <rect x="6"  y="26" width="8"  height="14" fill="#3DAF52"/>

  <!-- FUSELAGE (elongated) -->
  <rect x="12" y="20" width="88" height="26" fill="#3DAF52"/>
  <rect x="16" y="16" width="84" height="34" fill="#3DAF52"/>
  <!-- Tail taper -->
  <rect x="96" y="22" width="28" height="22" fill="#3DAF52"/>
  <rect x="114" y="26" width="16" height="14" fill="#2D8A3E"/>
  <rect x="124" y="28" width="8"  height="10" fill="#2D8A3E"/>

  <!-- Engine cowl -->
  <rect x="10" y="20" width="12" height="26" fill="#2D8A3E"/>
  <rect x="8"  y="22" width="6"  height="22" fill="#1F6B2E"/>

  <!-- COCKPIT CANOPY (raised bubble) -->
  <rect x="44" y="10" width="34" height="18" fill="#87CEEB"/>
  <rect x="46" y="8"  width="30" height="20" fill="#87CEEB"/>
  <rect x="48" y="10" width="26" height="16" fill="#C8EEFF"/>
  <!-- Canopy frame divider -->
  <rect x="60" y="8"  width="4"  height="20" fill="#2D8A3E"/>

  <!-- SINGLE WING (swept low-wing) -->
  <rect x="44" y="50" width="56" height="8"  fill="#3DAF52"/>
  <rect x="40" y="48" width="58" height="4"  fill="#2D8A3E"/>
  <rect x="36" y="50" width="6"  height="4"  fill="#3DAF52"/>

  <!-- TAIL VERTICAL FIN -->
  <rect x="118" y="8"  width="12" height="24" fill="#3DAF52"/>
  <rect x="124" y="4"  width="8"  height="14" fill="#2D8A3E"/>

  <!-- TAIL HORIZONTAL FINS -->
  <rect x="108" y="52" width="24" height="6"  fill="#F5C142"/>
  <rect x="116" y="50" width="16" height="4"  fill="#F5C142"/>

  <!-- YELLOW ACCENT STRIPES (top + bottom) -->
  <rect x="16" y="16" width="82" height="4"  fill="#F5C142"/>
  <rect x="16" y="46" width="82" height="4"  fill="#F5C142"/>

  <!-- PROPELLER HUB -->
  <rect x="0"  y="28" width="8"  height="10" fill="#4A4A4A"/>
  <!-- Propeller blades (green with yellow tips) -->
  <rect x="1"  y="12" width="4"  height="18" fill="#2D8A3E"/>
  <rect x="1"  y="36" width="4"  height="18" fill="#2D8A3E"/>
  <rect x="1"  y="10" width="4"  height="4"  fill="#F5C142"/>
  <rect x="1"  y="52" width="4"  height="4"  fill="#F5C142"/>

  <!-- LANDING GEAR -->
  <rect x="54" y="58" width="4"  height="8"  fill="#777"/>
  <rect x="70" y="58" width="4"  height="8"  fill="#777"/>
  <rect x="46" y="62" width="18" height="4"  fill="#1A1A1A"/>
  <rect x="62" y="62" width="18" height="4"  fill="#1A1A1A"/>
</svg>
