      col * FRAME_W, row * FRAME_H, FRAME_W, FRAME_H,
      0, 0, canvas.width, canvas.height
    );
    requestAnimationFrame(tick);
  }

  img.onload  = () => requestAnimationFrame(tick);
  img.onerror = () => {
    ctx.fillStyle = '#f66';
    ctx.font = '14px sans-serif';
    ctx.fillText('Failed to load sprite', 10, 30);
  };
</script>
</body>
</html>
